<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" fill="none">
  <defs>
    <linearGradient id="badgeBlue" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="orbitGreen" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Símbolo com Arco Orbital e Selo Azul Verificado -->
  <g transform="translate(15, 15)">
    <!-- Arco Orbital -->
    <path d="M8 30C8 17.8497 17.8497 8 30 8C36.9 8 43.1 11.2 47 16.3" stroke="url(#orbitGreen)" stroke-width="3" stroke-linecap="round" />
    <path d="M52 30C52 42.1503 42.1503 52 30 52C23.1 52 16.9 48.8 13 43.7" stroke="url(#orbitGreen)" stroke-width="3" stroke-linecap="round" />

    <!-- Selo Roseta Verificado Azul -->
    <g transform="translate(13, 13)">
      <path d="M16 0L20.1 3.5L25.5 3.3L27.6 8.3L32.4 10.7L32 16.1L35.5 20.2L32.8 24.9L33.7 30.3L28.6 32.1L26.8 37.2L21.5 36.4L18 40.2L13.5 37.2L8.2 38.1L6.3 33.1L1.5 30.7L1.9 25.3L-1.6 21.2L1.1 16.5L0.2 11.1L5.3 9.3L7.1 4.2L12.4 5L16 0Z" transform="scale(0.85) translate(2, 2)" fill="url(#badgeBlue)" />
      <path d="M11 17L15 21L23 13" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Tipografia: nome limpo. express -->
  <text x="90" y="48" font-family="'Onest', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#f8fafc" letter-spacing="-0.5">nome</text>
  <text x="180" y="48" font-family="'Onest', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#34d399" letter-spacing="-0.5">limpo.</text>
  <text x="125" y="68" font-family="'Georgia', serif" font-style="italic" font-weight="700" font-size="18" fill="#34d399" letter-spacing="0.5">express</text>
</svg>
